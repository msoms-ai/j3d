version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: j3d-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-j3d_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-j3d_prod_secure_2026}
      POSTGRES_DB: ${POSTGRES_DB:-j3d_platform}
    volumes:
      - j3d_prod_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-j3d_admin} -d ${POSTGRES_DB:-j3d_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - j3d-net

  redis:
    image: redis:7.2-alpine
    container_name: j3d-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - j3d_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - j3d-net

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: j3d-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-j3d_minio_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-j3d_minio_password}
    ports:
      - "127.0.0.1:9070:9000"
      - "127.0.0.1:9071:9001"
    volumes:
      - j3d_prod_minio_data:/data
    networks:
      - j3d-net

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: j3d-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-j3d_admin}:${POSTGRES_PASSWORD:-j3d_prod_secure_2026}@postgres:5432/${POSTGRES_DB:-j3d_platform}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: https://j3d.msoms.ai/storage/j3d-assets
    ports:
      - "127.0.0.1:8070:4000"
    networks:
      - j3d-net

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web.prod
      args:
        NEXT_PUBLIC_SITE_URL: "https://j3d.msoms.ai"
        NEXT_PUBLIC_API_URL: "https://j3d.msoms.ai/api/v1"
        NEXT_PUBLIC_WS_URL: "https://j3d.msoms.ai"
        NEXT_PUBLIC_APP_VERSION: "v1.0.0-prod"
        NEXT_PUBLIC_BUILD_DATE: "2026-11-24T00:00:00Z"
        NEXT_PUBLIC_GITHUB_REPO: "https://github.com/msoms-ai/j3d"
    container_name: j3d-web
    restart: always
    depends_on:
      - api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_SITE_URL: "https://j3d.msoms.ai"
      NEXT_PUBLIC_API_URL: "https://j3d.msoms.ai/api/v1"
      NEXT_PUBLIC_WS_URL: "https://j3d.msoms.ai"
    ports:
      - "127.0.0.1:3070:3000"
    networks:
      - j3d-net

networks:
  j3d-net:
    name: j3d-net
    driver: bridge

volumes:
  j3d_prod_pg_data:
    name: j3d_prod_pg_data
  j3d_prod_redis_data:
    name: j3d_prod_redis_data
  j3d_prod_minio_data:
    name: j3d_prod_minio_data
